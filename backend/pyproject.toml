[project]
name = "impiricus-ambient-backend"
version = "0.1.0"
description = "Impiricus Ambient — hackathon prototype backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "google-genai>=1.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a real Timescale/pgvector database (TEST_DATABASE_URL)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "E501",  # long strings are fine; `ruff format` handles code layout
]

[tool.ruff.lint.per-file-ignores]
"app/ingestion/*" = ["ASYNC240"]  # CLI seed script, blocking file reads are fine
"tests/*" = ["ASYNC240"]
